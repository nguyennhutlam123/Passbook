<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông báo - PassBook</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/workspace.css">
</head>
<body>
    <header class="site-header" data-site-header></header>
    <main class="page-shell" data-notification-page>
        <section class="section-heading">
            <div><span class="eyebrow">Tài khoản</span><h1>Thông báo</h1></div>
            <button class="button button-outline" type="button" data-mark-all>Đánh dấu tất cả đã đọc</button>
        </section>
        <div class="report-list" data-notification-list><p class="loading-state">Đang tải thông báo...</p></div>
        <div data-notification-pagination></div>
        <p class="form-error" role="alert" data-notification-error></p>
    </main>
    <footer class="site-footer" data-site-footer></footer>
    <script src="js/core/storage.js"></script>
    <script src="js/core/errors.js"></script>
    <script src="js/core/auth.js"></script>
    <script src="js/core/router.js"></script>
    <script src="js/core/guards.js"></script>
    <script src="js/components/common/common.js"></script>
    <script src="js/api.js"></script>
    <script src="js/api/utils.js"></script>
    <script src="js/api/auth-api.js"></script>
    <script src="js/api/notifications-api.js"></script>
    <script src="js/main.js"></script>
    <script src="js/notifications.js"></script>
</body>
</html>
