<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng bán - PassBook</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header" data-site-header></header>
    <main class="page-shell sell-page">
        <div class="page-intro">
            <span class="eyebrow">Góc người bán</span>
            <h1>Đăng bán giáo trình</h1>
            <p class="text-secondary">Chia sẻ giáo trình bạn không còn sử dụng với sinh viên cùng trường.</p>
        </div>
        <form class="sell-form" data-sell-form novalidate>
            <div class="sell-form__grid">
                <div class="form-group form-group--wide">
                    <label class="form-label" for="book-title">Tên giáo trình *</label>
                    <input id="book-title" name="title" type="text">
                    <span class="form-error" data-error-for="title"></span>
                </div>
                <div class="form-group">
                    <label class="form-label" for="book-subject">Môn học *</label>
                    <select id="book-subject" name="subject_id">
                        <option value="">Chọn môn học</option>
                        <option value="1">Cơ học</option>
                        <option value="9">Xác suất thống kê</option>
                        <option value="10">Vật lý đại cương</option>
                        <option value="15">Cơ sở dữ liệu</option>
                        <option value="16">Mạng máy tính</option>
                        <option value="17">Hệ điều hành</option>
                        <option value="18">Kỹ thuật lập trình</option>
                        <option value="19">Trí tuệ nhân tạo</option>
                        <option value="20">Kiến trúc máy tính</option>
                    </select>
                    <span class="form-error" data-error-for="subject_id"></span>
                </div>
                <div class="form-group">
                    <label class="form-label" for="book-code">Danh mục</label>
                    <select id="book-code" name="category_id">
                        <option value="">Chọn danh mục</option>
                        <option value="1">Giáo trình</option>
                        <option value="5">Giáo trình đại cương</option>
                        <option value="6">Công nghệ thông tin</option>
                        <option value="7">Kỹ thuật</option>
                        <option value="8">Kinh tế - Quản trị</option>
                        <option value="9">Ngoại ngữ</option>
                        <option value="10">Kỹ năng học tập</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="book-price">Giá *</label>
                    <input id="book-price" name="price" type="number" min="1" step="1000">
                    <span class="form-error" data-error-for="price"></span>
                </div>
                <div class="form-group">
                    <label class="form-label" for="book-condition">Tình trạng *</label>
                    <select id="book-condition" name="condition">
                        <option value="">Chọn tình trạng</option>
                        <option value="new">Mới</option><option value="like_new">Như mới</option><option value="good">Tốt</option><option value="used">Đã sử dụng</option>
                    </select>
                    <span class="form-error" data-error-for="condition"></span>
                </div>
                <div class="form-group">
                    <label class="form-label" for="book-edition">Phiên bản</label>
                    <input id="book-edition" name="edition" type="text">
                </div>
                <div class="form-group">
                    <label class="form-label" for="book-year">Năm xuất bản</label>
                    <input id="book-year" name="publication_year" type="number" min="1900" max="2100">
                </div>
                <div class="form-group form-group--wide">
                    <label class="form-label" for="book-description">Mô tả *</label>
                    <textarea id="book-description" name="description"></textarea>
                    <span class="form-error" data-error-for="description"></span>
                </div>
                <div class="form-group form-group--wide">
                    <label class="form-label" for="book-image-file">Ảnh giáo trình *</label>
                    <input id="book-image-file" name="image" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple>
                    <span class="caption">Chọn một hoặc nhiều ảnh JPG, PNG, WebP hoặc GIF (tối đa 10 MB mỗi ảnh).</span>
                    <span class="form-error" data-error-for="images"></span>
                    <div class="upload-previews" data-upload-previews></div>
                </div>
            </div>
            <button class="button button-primary" type="submit">Đăng tin</button>
        </form>
        <section class="success-panel" data-sell-success hidden>
            <span class="success-panel__icon" aria-hidden="true">✓</span>
            <h2>Đăng tin thành công!</h2>
            <p>Giáo trình của bạn đã được tạo.</p>
            <div>
                <a class="button button-primary" href="profile.html">Xem tin đăng</a>
                <button class="button button-outline" type="button" data-new-listing>Tiếp tục đăng bán</button>
            </div>
        </section>
    </main>
    <footer class="site-footer" data-site-footer></footer>
    <script src="js/core/storage.js"></script>
    <script src="js/core/errors.js"></script>
    <script src="js/core/auth.js"></script>
    <script src="js/core/router.js"></script>
    <script src="js/core/guards.js"></script>
    <script src="js/components/common/common.js"></script>
    <script src="js/components/books/book-card.js"></script>
    <script src="js/components/commerce/cards.js"></script>
    <script src="js/components/messaging/cards.js"></script>
    <script src="js/api.js"></script>
    <script src="js/api/utils.js"></script>
    <script src="js/api/auth-api.js"></script>
    <script src="js/api/users-api.js"></script>
    <script src="js/api/books-api.js"></script>
    <script src="js/api/favorites-api.js"></script>
    <script src="js/api/reservations-api.js"></script>
    <script src="js/api/orders-api.js"></script>
    <script src="js/api/payments-api.js"></script>
    <script src="js/api/shipping-api.js"></script>
    <script src="js/api/returns-api.js"></script>
    <script src="js/api/messaging-api.js"></script>
    <script src="js/api/notifications-api.js"></script>
    <script src="js/api/reports-api.js"></script>
    <script src="js/api/admin-api.js"></script>
    <script src="js/main.js"></script>
    <script src="js/sell.js"></script>
</body>
</html>
