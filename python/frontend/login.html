<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - PassBook</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header" data-site-header></header>
    <main class="page-shell auth-page">
        <section class="auth-card">
            <span class="eyebrow">Chào mừng trở lại</span>
            <h1>Đăng nhập</h1>
            <form data-login-form novalidate>
                <div class="form-group">
                    <label class="form-label" for="login-email">Email hoặc số điện thoại</label>
                    <input id="login-email" name="email" type="text" autocomplete="username">
                    <span class="form-error" data-error-for="email"></span>
                </div>
                <div class="form-group">
                    <label class="form-label" for="login-password">Mật khẩu</label>
                    <input id="login-password" name="password" type="password" autocomplete="current-password">
                    <span class="form-error" data-error-for="password"></span>
                </div>
                <button class="button button-primary" type="submit">Đăng nhập</button>
                <a class="auth-link" href="#forgot-password" data-forgot-toggle>Quên mật khẩu?</a>
            </form>
            <form data-forgot-password-form novalidate hidden>
                <h2>Đặt lại mật khẩu</h2>
                <div class="form-group">
                    <label class="form-label" for="forgot-target">Email hoặc số điện thoại</label>
                    <input id="forgot-target" name="target" type="text" autocomplete="username">
                    <span class="form-error" data-error-for="target"></span>
                </div>
                <button class="button button-primary" type="submit">Gửi mã xác minh</button>
            </form>
            <form data-forgot-otp-form novalidate hidden>
                <p class="caption" data-otp-expiry role="timer" aria-live="polite"></p>
                <div class="form-group">
                    <label class="form-label" for="forgot-otp">Mã xác minh 6 chữ số</label>
                    <input id="forgot-otp" name="otp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6">
                    <span class="form-error" data-error-for="otp"></span>
                </div>
                <button class="button button-primary" type="submit">Xác minh mã</button>
                <button class="button button-outline" type="button" data-forgot-resend disabled>Gửi lại mã</button>
            </form>
            <form data-reset-password-form novalidate hidden>
                <input type="hidden" name="reset_token">
                <div class="form-group">
                    <label class="form-label" for="reset-new-password">Mật khẩu mới</label>
                    <input id="reset-new-password" name="new_password" type="password" autocomplete="new-password">
                    <span class="form-error" data-error-for="new_password"></span>
                </div>
                <div class="form-group">
                    <label class="form-label" for="reset-confirm-password">Xác nhận mật khẩu</label>
                    <input id="reset-confirm-password" name="confirm_password" type="password" autocomplete="new-password">
                </div>
                <button class="button button-primary" type="submit">Đặt lại mật khẩu</button>
            </form>
            <p class="auth-switch">Chưa có tài khoản? <a href="register.html">Đăng ký</a></p>
        </section>
    </main>
    <footer class="site-footer" data-site-footer></footer>
    <script src="js/core/storage.js"></script>
    <script src="js/core/errors.js"></script>
    <script src="js/core/auth.js"></script>
    <script src="js/core/router.js"></script>
    <script src="js/core/guards.js"></script>
    <script src="js/components/common/common.js"></script>
    <script src="js/components/books/book-card.js"></script>
    <script src="js/components/commerce/cards.js"></script>
    <script src="js/components/messaging/cards.js"></script>
    <script src="js/api.js"></script>
    <script src="js/api/utils.js"></script>
    <script src="js/api/auth-api.js"></script>
    <script src="js/api/users-api.js"></script>
    <script src="js/api/books-api.js"></script>
    <script src="js/api/favorites-api.js"></script>
    <script src="js/api/reservations-api.js"></script>
    <script src="js/api/orders-api.js"></script>
    <script src="js/api/payments-api.js"></script>
    <script src="js/api/shipping-api.js"></script>
    <script src="js/api/returns-api.js"></script>
    <script src="js/api/messaging-api.js"></script>
    <script src="js/api/notifications-api.js"></script>
    <script src="js/api/reports-api.js"></script>
    <script src="js/api/admin-api.js"></script>
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
