<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - PassBook</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header" data-site-header></header>
    <main class="page-shell auth-page">
        <section class="auth-card">
            <span class="eyebrow">Tham gia PassBook</span>
            <h1>Đăng ký</h1>
            <form data-register-form novalidate>
                <div class="form-group">
                    <label class="form-label" for="register-name">Họ tên</label>
                    <input id="register-name" name="name" type="text" autocomplete="name">
                    <span class="form-error" data-error-for="name"></span>
                </div>
                <div class="form-group">
                    <label class="form-label" for="register-email">Email</label>
                    <input id="register-email" name="email" type="email" autocomplete="email">
                    <span class="form-error" data-error-for="email"></span>
                </div>
                <div class="form-group">
                    <label class="form-label" for="register-phone">Số điện thoại (không bắt buộc)</label>
                    <input id="register-phone" name="phone" type="tel" autocomplete="tel">
                    <span class="form-error" data-error-for="phone"></span>
                </div>
                <div class="form-group">
                    <label class="form-label" for="register-password">Mật khẩu</label>
                    <input id="register-password" name="password" type="password" autocomplete="new-password">
                    <span class="form-error" data-error-for="password"></span>
                </div>
                <div class="form-group">
                    <label class="form-label" for="register-confirm-password">Xác nhận mật khẩu</label>
                    <input id="register-confirm-password" name="confirmPassword" type="password" autocomplete="new-password">
                    <span class="form-error" data-error-for="confirmPassword"></span>
                </div>
                <button class="button button-primary" type="submit">Đăng ký</button>
            </form>
            <section class="success-panel" data-register-success hidden role="status" aria-live="polite">
                <span class="success-panel__icon" aria-hidden="true">✓</span>
                <h2>Đăng ký thành công</h2>
                <p>Tài khoản đã sẵn sàng. Hãy đăng nhập để tiếp tục.</p>
                <a class="button button-primary" href="login.html">Đến đăng nhập</a>
            </section>
            <form data-register-otp-form novalidate hidden>
                <p>Mã xác minh đã được gửi đến <strong data-register-otp-target></strong>.</p>
                <p class="caption" data-otp-expiry role="timer" aria-live="polite"></p>
                <div class="form-group">
                    <label class="form-label" for="register-otp">Mã xác minh 6 chữ số</label>
                    <input id="register-otp" name="otp" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
                    <span class="form-error" data-error-for="otp"></span>
                </div>
                <button class="button button-primary" type="submit">Xác minh email</button>
                <button class="button button-outline" type="button" data-register-resend disabled>Gửi lại mã</button>
            </form>
            <p class="auth-switch">Đã có tài khoản? <a href="login.html">Đăng nhập</a></p>
        </section>
    </main>
    <footer class="site-footer" data-site-footer></footer>
    <script src="js/core/storage.js"></script>
    <script src="js/core/errors.js"></script>
    <script src="js/core/auth.js"></script>
    <script src="js/core/router.js"></script>
    <script src="js/core/guards.js"></script>
    <script src="js/components/common/common.js"></script>
    <script src="js/api.js"></script>
    <script src="js/api/auth-api.js?v=otp-disabled-20261006"></script>
    <script src="js/api/notifications-api.js"></script>
    <script src="js/main.js"></script>
    <script src="js/auth.js?v=otp-disabled-20261006"></script>
</body>
</html>
