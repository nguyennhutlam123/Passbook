<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiểm duyệt báo cáo - PassBook</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/workspace.css">
</head>
<body>
    <header class="site-header" data-site-header></header>
    <main class="page-shell" data-admin-dashboard>
        <section class="page-heading">
            <span class="eyebrow">Moderation</span><h1>Kiểm duyệt báo cáo</h1>
            <nav class="admin-nav"><a href="index.html">Tổng quan</a><a href="reports.html">Báo cáo</a><a href="users.html">Tài khoản</a></nav>
        </section>
        <div hidden data-admin-metrics></div>
        <section>
            <div class="section-heading">
                <h2>Báo cáo</h2>
                <label class="form-label" for="admin-report-filter">Trạng thái</label>
                <select id="admin-report-filter" class="form-control" data-report-filter>
                    <option value="">Tất cả</option><option value="OPEN">Mới</option>
                    <option value="IN_REVIEW">Đang xem xét</option><option value="RESOLVED">Đã xử lý</option>
                    <option value="REJECTED">Từ chối</option>
                </select>
            </div>
            <div class="report-list" data-admin-reports><p class="loading-state">Đang tải báo cáo...</p></div>
        </section>
        <p class="form-error" role="alert" data-admin-error></p>
    </main>
    <footer class="site-footer" data-site-footer></footer>
    <script src="../js/core/storage.js"></script><script src="../js/core/errors.js"></script>
    <script src="../js/core/auth.js"></script><script src="../js/core/router.js"></script><script src="../js/core/guards.js"></script>
    <script src="../js/components/common/common.js"></script>
    <script src="../js/api.js"></script><script src="../js/api/utils.js"></script><script src="../js/api/auth-api.js"></script>
    <script src="../js/api/notifications-api.js"></script><script src="../js/api/admin-api.js"></script>
    <script src="../js/main.js"></script><script src="../js/admin.js"></script>
</body>
</html>
