<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang cá nhân - PassBook</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/workspace.css">
</head>
<body>
    <header class="site-header" data-site-header></header>
    <main class="page-shell profile-page" data-profile-page>
        <section class="profile-header">
            <span class="profile-avatar avatar">NL</span>
            <div>
                <h1 data-profile-name>Nguyễn Lâm <span class="verified">✓</span></h1>
                <p data-profile-school>HCMUE</p>
                <p class="caption">MSSV: <span data-profile-student-id>********</span></p>
            </div>
        </section>
        <section class="profile-listings">
            <div class="section-heading"><div><span class="eyebrow">Tài khoản</span><h2>Thông tin cá nhân</h2></div></div>
            <form class="workspace-checkout" data-profile-form>
                <label class="form-label" for="profile-name">Họ tên</label>
                <input class="form-control" id="profile-name" name="name" maxlength="150" required>
                <label class="form-label" for="profile-avatar">Ảnh đại diện (HTTPS URL)</label>
                <input class="form-control" id="profile-avatar" name="avatar" type="url">
                <button class="button button-primary" type="submit">Lưu hồ sơ</button>
            </form>
            <form class="workspace-checkout" data-password-form>
                <h3>Đổi mật khẩu</h3>
                <label class="form-label" for="old-password">Mật khẩu hiện tại</label>
                <input class="form-control" id="old-password" name="old_password" type="password" autocomplete="current-password" required>
                <label class="form-label" for="new-password">Mật khẩu mới</label>
                <input class="form-control" id="new-password" name="new_password" type="password" minlength="8" autocomplete="new-password" required>
                <button class="button button-outline" type="submit">Đổi mật khẩu</button>
            </form>
        </section>
        <section class="profile-listings">
            <div class="section-heading"><div><span class="eyebrow">Giao hàng</span><h2>Địa chỉ của tôi</h2></div></div>
            <form class="workspace-checkout" data-address-form>
                <input type="hidden" name="id">
                <label class="form-label" for="address-recipient">Người nhận</label>
                <input class="form-control" id="address-recipient" name="recipient_name" maxlength="150" required>
                <label class="form-label" for="address-phone">Điện thoại</label>
                <input class="form-control" id="address-phone" name="phone" maxlength="30" required>
                <label class="form-label" for="address-line">Địa chỉ</label>
                <input class="form-control" id="address-line" name="address_line" maxlength="500" required>
                <label class="form-label" for="address-ward">Phường / xã</label>
                <input class="form-control" id="address-ward" name="ward" maxlength="150" required>
                <label class="form-label" for="address-district">Quận / huyện</label>
                <input class="form-control" id="address-district" name="district" maxlength="150" required>
                <label class="form-label" for="address-city">Tỉnh / thành phố</label>
                <input class="form-control" id="address-city" name="city" maxlength="150" required>
                <label class="form-label" for="address-postal">Mã bưu chính (không bắt buộc)</label>
                <input class="form-control" id="address-postal" name="postal_code" maxlength="30">
                <label><input name="is_default" type="checkbox"> Địa chỉ mặc định</label>
                <button class="button button-primary" type="submit">Lưu địa chỉ</button>
                <button class="button button-outline" type="reset" data-address-reset>Nhập địa chỉ mới</button>
            </form>
            <div class="report-list" data-address-list></div>
        </section>
        <section class="profile-listings">
            <div class="section-heading"><div><span class="eyebrow">Trao đổi</span><h2>Cuộc hội thoại</h2></div></div>
            <div class="conversation-list" data-conversation-list><p class="caption">Đang tải...</p></div>
        </section>
        <section class="profile-listings">
            <div class="section-heading"><div><span class="eyebrow">An toàn</span><h2>Báo cáo của tôi</h2></div></div>
            <div class="report-list" data-report-list><p class="caption">Đang tải...</p></div>
        </section>
        <section class="profile-listings">
            <div class="section-heading">
                <div><span class="eyebrow">Quản lý</span><h2>Tin đăng của tôi</h2></div>
            </div>
            <div class="profile-tabs" role="tablist">
                <button class="button is-active" type="button" data-profile-tab="available" aria-selected="true">Tin đang bán</button>
                <button class="button button-outline" type="button" data-profile-tab="sold" aria-selected="false">Đã bán</button>
                <button class="button button-outline" type="button" data-profile-tab="saved" aria-selected="false">Đã lưu</button>
            </div>
            <div class="book-grid profile-grid" data-profile-grid></div>
            <div class="empty-state" data-profile-empty hidden><strong>Chưa có tin đăng</strong><a class="button button-primary" href="sell.html">Đăng bán giáo trình</a></div>
        </section>
    </main>
    <footer class="site-footer" data-site-footer></footer>
    <script src="js/core/storage.js"></script>
    <script src="js/core/errors.js"></script>
    <script src="js/core/auth.js"></script>
    <script src="js/core/router.js"></script>
    <script src="js/core/guards.js"></script>
    <script src="js/components/common/common.js"></script>
    <script src="js/components/books/book-card.js"></script>
    <script src="js/components/commerce/cards.js"></script>
    <script src="js/components/messaging/cards.js"></script>
    <script src="js/api.js"></script>
    <script src="js/api/utils.js"></script>
    <script src="js/api/auth-api.js"></script>
    <script src="js/api/users-api.js"></script>
    <script src="js/api/books-api.js"></script>
    <script src="js/api/favorites-api.js"></script>
    <script src="js/api/reservations-api.js"></script>
    <script src="js/api/orders-api.js"></script>
    <script src="js/api/payments-api.js"></script>
    <script src="js/api/shipping-api.js"></script>
    <script src="js/api/returns-api.js"></script>
    <script src="js/api/messaging-api.js"></script>
    <script src="js/api/notifications-api.js"></script>
    <script src="js/api/reports-api.js"></script>
    <script src="js/api/admin-api.js"></script>
    <script src="js/main.js"></script>
    <script src="js/profile-account.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
