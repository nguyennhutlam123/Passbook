<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đơn hàng - PassBook</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/workspace.css">
</head>
<body>
    <header class="site-header" data-site-header></header>
    <main class="page-shell orders-page" data-orders-page>
        <div class="page-intro">
            <span class="eyebrow">Giao dịch</span>
            <h1>Đơn hàng</h1>
            <p class="text-secondary">Theo dõi sản phẩm, thanh toán và trạng thái giao hàng.</p>
            <button class="button button-outline" type="button" data-orders-refresh>
                Cập nhật trạng thái
            </button>
        </div>
        <p class="form-error" role="alert" data-orders-error></p>
        <div class="orders-list" data-orders-list aria-live="polite">
            <p class="loading-state">Đang tải đơn hàng...</p>
        </div>
    </main>
    <footer class="site-footer" data-site-footer></footer>
    <script src="js/core/storage.js"></script>
    <script src="js/core/errors.js"></script>
    <script src="js/core/auth.js"></script>
    <script src="js/core/router.js"></script>
    <script src="js/core/guards.js"></script>
    <script src="js/components/common/common.js"></script>
    <script src="js/api.js"></script>
    <script src="js/api/utils.js"></script>
    <script src="js/api/auth-api.js"></script>
    <script src="js/api/orders-api.js"></script>
    <script src="js/api/notifications-api.js"></script>
    <script src="js/main.js"></script>
    <script src="js/orders.js?v=shipment-order-sync-1"></script>
</body>
</html>
